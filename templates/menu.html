<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Menu - Masrur Cafe</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/styles.css') }}">
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar">

        <h1 class="logo">Masrur Cafe</h1>

        <ul>
            <li><a href="/">Home</a></li>
            <li><a href="/menu">Menu</a></li>
            <li><a href="/about">About Us</a></li>
            <li><a href="/contact">Contact</a></li>
        </ul>

    </nav>


    <!-- Menu Section -->
    <section class="welcome">

        <h2>Our Menu</h2>

        <div class="menu-container">

            <!-- Get food items from SQLite database -->
            {% for item in menu_items %}

            <div class="menu-card">

                <!-- Food Image -->
                <img src="{{ url_for('static',
                    filename='images/' + item['image']) }}"
                    alt="{{ item['name'] }}">

                <!-- Food Name -->
                <h3>{{ item['name'] }}</h3>

                <!-- Category -->
                <p class="category">
                    {{ item['category'] }}
                </p>

                <!-- Description -->
                <p>
                    {{ item['description'] }}
                </p>

                <!-- Price -->
                <h4>
                    KSh {{ item['price'] }}
                </h4>

                <!-- Order Button -->
                <button type="button">
                    Order
                </button>

            </div>

            {% endfor %}

        </div>

    </section>


    <!-- Footer -->
    <footer>

        <p>
            &copy; 2026 Masrur Cafe & Restaurant
        </p>

    </footer>

</body>

</html>
